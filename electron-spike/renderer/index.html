<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Onda Recall Adhoc Spike</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #0f1419;
        --fg: #e7ecf1;
        --muted: #8b9aab;
        --accent: #1f6feb;
        --danger: #cf222e;
        --ok: #1a7f37;
        --panel: #1a222c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: var(--bg);
        color: var(--fg);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 16px 20px;
        border-bottom: 1px solid #2a3441;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 16px;
        font-weight: 600;
      }
      .meta {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }
      .controls {
        display: flex;
        gap: 10px;
        padding: 16px 20px;
        align-items: center;
      }
      button {
        border: 0;
        border-radius: 6px;
        padding: 10px 16px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        color: #fff;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      #start { background: var(--ok); }
      #stop { background: var(--danger); }
      .pill {
        font-size: 12px;
        color: var(--muted);
      }
      .pill strong { color: var(--fg); }
      #log {
        flex: 1;
        margin: 0 20px 20px;
        padding: 12px;
        background: var(--panel);
        border: 1px solid #2a3441;
        border-radius: 8px;
        overflow: auto;
        font-size: 12px;
        line-height: 1.45;
        white-space: pre-wrap;
      }
      .line-error { color: #ff7b72; }
      .line-warn { color: #d29922; }
      .line-info { color: var(--fg); }
      .line-debug { color: var(--muted); }
    </style>
  </head>
  <body>
    <header>
      <h1>Onda · Recall adhoc / in-person spike</h1>
      <div class="meta" id="meta">Loading…</div>
    </header>
    <div class="controls">
      <button id="start" type="button">Start recording</button>
      <button id="stop" type="button" disabled>Stop + retrieve audio</button>
      <span class="pill" id="state">idle</span>
    </div>
    <div id="log"></div>
    <script src="./renderer.js"></script>
  </body>
</html>
